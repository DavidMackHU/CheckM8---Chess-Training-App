name: CI

# Runs on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  check:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type-check (also generates the database client)
        run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openingdrill
          POSTGRES_PASSWORD: openingdrill
          POSTGRES_DB: openingdrill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openingdrill -d openingdrill"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openingdrill:openingdrill@localhost:5432/openingdrill?schema=public
      # Test-only value. Real deployments set their own secret.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Create tables and load the official courses
        run: |
          npm run db:push
          npm run db:seed
      - name: Run the browser tests
        run: npm run test:e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the server and client images
        run: docker compose --profile full build
